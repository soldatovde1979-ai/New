[project]
name = "svo-docs-automation"
version = "0.1.0"
description = "Автоматическая генерация и проверка актуальности документации проекта (spec.md/data.md)"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "Jinja2>=3.1",
]

[project.scripts]
svo-docs = "svo_docs.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
